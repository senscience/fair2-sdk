[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notebook-runner"
version = "0.1.0"
description = "Run notebooks from scratch and measure them: completion, time, memory, downloads, dependencies."
readme = "README.md"
requires-python = ">=3.11"
# Upper bounds: the next major version (the next minor one for 0.x nbclient). No kernel: the
# notebooks run in their own environment (`python=`, `--fresh-env`), which has ipykernel.
dependencies = [
  "nbclient>=0.11.0,<0.12",
  "nbformat>=5.11.1,<6",
  "jupyter-client>=8.10.0,<9",
  "psutil>=7.2.2,<8",
  # The Markdown summary (--summary): templates/summary.md.j2.
  "jinja2>=3.1.6,<4",
]

[project.optional-dependencies]
# Running notebooks in the environment of notebook-runner itself (no `python=`): its kernel.
local = ["ipykernel>=7.4.0,<8"]
# ipywidgets and py3Dmol: a cell displaying in an Output widget (zmq_wakeup).
test = [
  "notebook-runner[local]",
  "pytest>=9.1.1,<10",
  "ipywidgets>=8.1.9,<9",
  "py3dmol>=2.4.2,<3",
]

[project.scripts]
notebook-runner = "notebook_runner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
notebook_runner = ["templates/*.j2"]

# The workspace's Ruff settings, for the oldest Python this package supports.
[tool.ruff]
extend = "../../pyproject.toml"
target-version = "py311"
