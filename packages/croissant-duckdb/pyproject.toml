[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "croissant-duckdb"
version = "0.1.0"
description = "Expose the record sets of a Croissant dataset as DuckDB tables and views."
readme = "README.md"
requires-python = ">=3.12"
# Minimums: the latest versions, for their bug fixes and improvements. Upper bounds: the next major
# version (the next minor one for mlcroissant), which has to be tested before it is allowed.
dependencies = [
  "duckdb>=1.5.6,<2",
  "mlcroissant>=1.1.1,<1.2",
  # mlcroissant's own dependencies, which it doesn't bound.
  "absl-py>=2.5.1,<3",
  "etils[epath]>=1.14.0,<2",
  "jinja2>=3.1.6,<4",
  "jsonpath-rw>=1.4.0,<2",
  "networkx>=3.7,<4",
  "pandas>=3.0.6,<4",
  "pandas-stubs>=3.0.5.260914,<4",
  "python-dateutil>=2.9.0.post0,<3",
  "rdflib>=7.6.0,<8",
  "requests>=2.34.2,<3",
  "scipy>=1.18.1,<2",
  "tqdm>=4.70.1,<5",
]

[project.optional-dependencies]
# pyarrow: read Parquet files with mlcroissant, to compare its records with the tables.
test = ["pytest>=9.1.1,<10", "pyarrow>=26.0.0,<27"]

[tool.setuptools.packages.find]
where = ["src"]
