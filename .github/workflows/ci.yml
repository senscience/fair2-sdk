# Lint and test the packages of the workspace, on every pull request.
name: CI

on:
  pull_request:

# Read-only access to the repository is enough.
permissions:
  contents: read

# A new push to the pull request cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Install the workspace
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check --output-format github
      - name: Check the formatting
        run: uv run ruff format --check

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      # Run every version even if one fails, to see all the failures at once.
      fail-fast: false
      matrix:
        # From the minimum supported by the packages (requires-python) to the latest.
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the workspace
        run: uv sync --locked
      - name: Test croissant-duckdb
        run: uv run pytest packages/croissant-duckdb/tests
      - name: Test fair2
        run: uv run pytest packages/fair2/tests

  widgets:
    name: Widgets (JavaScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/fair2/js
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install the JavaScript dependencies
        run: npm ci
      - name: Test the completion
        run: npm test
      # The bundle is committed, so that installing fair2 needs no JavaScript build.
      - name: Check that the bundle is built from these sources
        run: npm run build && git diff --exit-code -- ../src/fair2/static
