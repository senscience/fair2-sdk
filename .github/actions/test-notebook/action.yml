# Runs the notebook of a dataset from scratch with notebook-runner, as on a first visit: a new
# Python environment with only ipykernel, where the notebook's install cell runs. For the notebooks
# repositories (one per environment), checked out before:
#
#   - uses: actions/checkout@v7
#   - uses: senscience/fair2-sdk/.github/actions/test-notebook@<full commit SHA>
#     with:
#       doi: 10.71728/senscience.qs2f-h81p
#
# notebook-runner is installed from this action's own copy of fair2-sdk: the commit the action is
# used at is also the version of notebook-runner.
name: Test a FAIR² notebook
description: Run the notebook of a dataset from scratch with notebook-runner, and keep its report.

inputs:
  doi:
    description: "Dataset DOI, e.g. 10.71728/senscience.qs2f-h81p; its folder holds the notebook"
    required: true
  notebook:
    description: "Notebook file in the dataset's folder"
    default: notebook.ipynb
  path:
    description: "Where the notebooks repository is checked out, relative to the workspace"
    default: "."
  branch-patch:
    description: >-
      "true" to use the checked-out tools/patch_fair2.py instead of the one the notebook downloads
      from GitHub (a raw.githubusercontent.com URL), to test a change to it before it is merged
    default: "true"
  python-version:
    description: "Python version of the notebook's fresh environment"
    default: "3.13"
  timeout:
    description: "Timeout per cell, in seconds"
    default: "600"
  skip-cells:
    description: "Comma-separated ids of cells not to run (e.g. a widget needing a browser)"
    default: ""
  artifact-name:
    description: "Name of the artifact with the report and the executed notebook (unique in a run)"
    default: notebook-run

outputs:
  report:
    description: "Path of the JSON report (in the runner's temporary folder)"
    value: ${{ steps.notebook.outputs.report }}

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v10.3.0

    - name: Find the notebook
      id: notebook
      shell: bash
      env:
        DOI: ${{ inputs.doi }}
        NOTEBOOK: ${{ inputs.notebook }}
        REPOSITORY: ${{ inputs.path }}
      run: |
        # Inputs are only used through variables, after checking their form
        if ! [[ "$DOI" =~ ^10\.[0-9]{4,9}/[A-Za-z0-9._-]+$ ]]; then
          echo "::error::Not a DOI: $DOI"; exit 1
        fi
        if ! [[ "$NOTEBOOK" =~ ^[A-Za-z0-9._-]+\.ipynb$ ]]; then
          echo "::error::Not a notebook file name: $NOTEBOOK"; exit 1
        fi
        notebook="$REPOSITORY/$DOI/$NOTEBOOK"
        if [ ! -f "$notebook" ]; then
          echo "::error::No notebook at $notebook (is the notebooks repository checked out at '$REPOSITORY'?)"
          exit 1
        fi
        out="$RUNNER_TEMP/notebook-run"
        mkdir -p "$out"
        {
          echo "notebook=$notebook"
          echo "out=$out"
          echo "report=$out/report.json"
        } >> "$GITHUB_OUTPUT"

    - name: Use the checked-out patch_fair2
      if: inputs.branch-patch == 'true'
      shell: bash
      env:
        NOTEBOOK_PATH: ${{ steps.notebook.outputs.notebook }}
        REPOSITORY: ${{ inputs.path }}
      run: |
        patch="$(realpath "$REPOSITORY")/tools/patch_fair2.py"
        if [ ! -f "$patch" ]; then
          echo "No tools/patch_fair2.py in the repository: the notebook keeps its own"; exit 0
        fi
        # The checkout is thrown away after the job: the notebook can be changed in place. Whatever
        # the repository and ref in the URL, as each environment has its own notebooks repository.
        sed -E -i "s#https://raw\.githubusercontent\.com/[^\"' ]+/tools/patch_fair2\.py#file://$patch#g" "$NOTEBOOK_PATH"
        echo "patch_fair2 from $patch: $(grep -c "file://$patch" "$NOTEBOOK_PATH" || true) line(s) of the notebook"

    - name: Install notebook-runner
      shell: bash
      run: uv tool install --python 3.12 "$GITHUB_ACTION_PATH/../../../packages/notebook-runner"

    - name: Run the notebook
      shell: bash
      env:
        NOTEBOOK_PATH: ${{ steps.notebook.outputs.notebook }}
        OUT: ${{ steps.notebook.outputs.out }}
        PYTHON_VERSION: ${{ inputs.python-version }}
        TIMEOUT: ${{ inputs.timeout }}
        SKIP_CELLS: ${{ inputs.skip-cells }}
      run: |
        args=(--fresh-env --python "$PYTHON_VERSION" --timeout "$TIMEOUT"
              --report "$OUT/report.json" --executed "$OUT/executed"
              --summary "$GITHUB_STEP_SUMMARY" --annotations)
        if [ -n "$SKIP_CELLS" ]; then args+=(--skip-cells "$SKIP_CELLS"); fi
        notebook-runner "${args[@]}" "$NOTEBOOK_PATH"

    - name: Keep the report and the executed notebook
      if: always() && steps.notebook.outputs.out != ''
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.notebook.outputs.out }}
        if-no-files-found: ignore
